name: Build iOS shell template
on: workflow_dispatch
permissions:
  contents: read
jobs:
  shell:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Prepare engine
        run: |
          command -v xcodegen || brew install xcodegen
          python3 -m pip install lz4 capstone fonttools
          python3 tools/engine.py sync
      - name: Build shell
        run: |
          set -euo pipefail
          python3 tools/build_shell_template.py --out "$RUNNER_TEMP/shell-template/DmShell.app"
          tar -czf "$RUNNER_TEMP/SpplechOS-shell-template.tar.gz" -C "$RUNNER_TEMP/shell-template" DmShell.app
          shasum -a 256 "$RUNNER_TEMP/SpplechOS-shell-template.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SpplechOS-shell-template
          path: ${{ runner.temp }}/SpplechOS-shell-template.tar.gz
          if-no-files-found: error
          retention-days: 3

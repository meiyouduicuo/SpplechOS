name: Focused iOS deletion regression
on: workflow_dispatch
permissions:
  contents: read
jobs:
  regression:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 tools/engine.py sync
      - run: swift test --package-path frontend-ios --filter GameDeletionTests/gameDataDeletionDoesNotRunOnMainThread

name: Build SpplechOS iOS shell and tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spplechos-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shell:
    name: Test and build the unsigned iOS shell
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Prepare build tools and the patched engine
        run: |
          set -euo pipefail
          mkdir -p logs
          xcodebuild -version
          command -v xcodegen || brew install xcodegen
          python3 -m pip install lz4 capstone fonttools
          python3 tools/engine.py -q sync 2>&1 | tee logs/engine-sync.log
          python3 tools/l10n_shell_catalogs.py --check

      - name: Test the build tools on macOS
        run: |
          set -euo pipefail
          python3 -m unittest discover tools/tests 2>&1 | tee logs/build-tool-tests.log
          python3 -m unittest discover -s .github/scripts/tests 2>&1 | tee logs/automation-tests.log

      - name: Build and test the shell package
        run: |
          set -euo pipefail
          swift build --package-path frontend-ios 2>&1 | tee logs/shell-package-build.log
          swift test --package-path frontend-ios 2>&1 | tee logs/shell-package-tests.log

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          devices = [device for runtime, items in inventory['devices'].items()
                     if '.iOS-' in runtime for device in items
                     if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not devices:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_UDID=' + devices[0]['udid'] + '\n')
          print('Simulator:', devices[0]['name'])
          PY

      - name: Test game package import, save reset and app settings on iOS
        run: |
          set -euo pipefail
          (cd frontend-ios/Demo && xcodegen generate)
          xcodebuild test \
            -project frontend-ios/Demo/ShellDemo.xcodeproj \
            -scheme ShellDemo \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/shell-demo-build" \
            -resultBundlePath "$RUNNER_TEMP/shell-ui-tests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:ShellDemoUITests/ShellHostUITests/testClearSavesRequiresConfirmationAndKeepsTheGameListed \
            -only-testing:ShellDemoUITests/ShellHostUITests/testGamePackagePickerCanBeCancelledWithoutChangingTheLibrary \
            -only-testing:ShellDemoUITests/ShellDemoUITests/testNativeLauncherBarsFollowTheActiveScreen \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee logs/shell-ios-ui-tests.log

      - name: Build the unsigned app template
        run: |
          set -euo pipefail
          python3 tools/build_shell_template.py \
            --out "$RUNNER_TEMP/shell-template/DmShell.app" 2>&1 | tee logs/shell-template-build.log
          tar -czf "$RUNNER_TEMP/SpplechOS-shell-template.tar.gz" \
            -C "$RUNNER_TEMP/shell-template" DmShell.app
          shasum -a 256 "$RUNNER_TEMP/SpplechOS-shell-template.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpplechOS-shell-template
          path: ${{ runner.temp }}/SpplechOS-shell-template.tar.gz
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: SpplechOS-shell-build-logs
          path: |
            logs/
            ${{ runner.temp }}/shell-ui-tests.xcresult
          if-no-files-found: ignore
          retention-days: 3
